<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Coleman para Peça Rara Contagem</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=League+Spartan:wght@700&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: página editorial em uma coluna de leitura; no computador a arara e o total acompanham ao lado. Azul só em ação e estado. */
:root{
  color-scheme: light;
  --paper:#FFF8F8;
  --ink:#000000;
  --blue:#0118D8;
  --muted:#6A6464;
  --line:rgba(0,0,0,.14);
  --display:"Anton","Arial Narrow",Impact,sans-serif;
  --body:"Open Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mark:"League Spartan","Century Gothic","Futura",sans-serif;
  --ease:cubic-bezier(.22,.8,.2,1);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
h1,h2,h3{overflow-wrap:break-word;font-family:var(--display);font-weight:400;text-transform:uppercase;line-height:1;margin:0;text-wrap:balance;letter-spacing:.005em}
p{margin:0}
button,input{font:inherit;color:inherit}
[hidden]{display:none !important}
:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
.wordmark{font-family:var(--mark);font-weight:700;font-size:24px;letter-spacing:-.02em;line-height:1}

.pill{display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:0 26px;border-radius:999px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);font-weight:600;font-size:15px;text-decoration:none;cursor:pointer;white-space:nowrap;transition:background .35s var(--ease),color .35s var(--ease),border-color .35s var(--ease),opacity .35s var(--ease)}
.pill:hover{background:var(--ink);color:var(--paper)}
.pill-blue{background:var(--blue);border-color:var(--blue);color:#fff}
.pill-blue:hover{background:var(--ink);border-color:var(--ink);color:#fff}
.pill[disabled]{opacity:.28;cursor:not-allowed}
.pill[disabled]:hover{background:var(--blue);border-color:var(--blue)}
.pill-wide{width:100%}
.textlink{color:var(--ink);font-weight:600;text-decoration:none;border-bottom:1.5px solid var(--ink);padding-bottom:3px;transition:opacity .3s var(--ease)}
.textlink:hover{opacity:.55}

/* ---------- Entrada ---------- */
.gate{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;justify-content:space-between;padding:28px 24px 40px;transition:opacity .7s var(--ease)}
.gate.leaving{opacity:0}
.gate-box{width:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:16px;flex:1;justify-content:center}
.gate-top{width:100%;max-width:1160px;margin:0 auto}
.gate-eyebrow{font-size:14px;color:var(--muted)}
.gate h1{font-size:clamp(52px,14vw,104px)}
.gate-text{max-width:32ch;font-size:17px}
.gate form{display:flex;flex-direction:column;gap:12px;margin-top:18px;max-width:380px}
.gate label{font-size:14px;color:var(--muted)}
.gate input{height:54px;border:0;border-bottom:1.5px solid var(--ink);border-radius:0;background:transparent;padding:0;font-size:22px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;transition:border-color .3s var(--ease)}
.gate input::placeholder{color:rgba(0,0,0,.3);letter-spacing:0;text-transform:none;font-weight:400;font-size:17px}
.gate input:focus{outline:none;border-bottom-color:var(--blue)}
.gate .pill{align-self:flex-start;margin-top:10px}
.gate-error{min-height:1.6em;font-size:14px;color:#B00020}
.gate-box.shake form{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

/* ---------- Proposta ---------- */
#app{max-width:1160px;margin:0 auto;padding:0 24px 132px}
.top{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:28px 0}
.top-client{width:46px;height:46px}
.hero{padding:clamp(40px,9vw,120px) 0 clamp(56px,9vw,128px);display:flex;flex-direction:column;align-items:flex-start;gap:28px}
.hero-for{font-size:15px;color:var(--muted)}
.hero h1{font-size:clamp(54px,11.5vw,168px);line-height:.94;max-width:11ch}
.lede{font-size:clamp(18px,1.9vw,22px);line-height:1.5;max-width:44ch}

.builder{display:flex;flex-direction:column;gap:8px;scroll-margin-top:8px;border-top:1.5px solid var(--ink);padding-top:28px}
.stage-col{display:flex;flex-direction:column;gap:20px}
.stage-head{display:flex;flex-direction:column;gap:10px}
.stage-head h2{font-size:clamp(34px,5vw,48px)}
.stage-head p{color:var(--muted);max-width:36ch}
#rack{display:block;width:100%;height:320px;touch-action:pan-y;cursor:grab}
#rack.grabbing{cursor:grabbing}
#rack.pointing{cursor:pointer}
.hint{font-size:13px;color:var(--muted)}

.summary,.done{display:flex;flex-direction:column;gap:0}
.summary{display:none}
.sum-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:16px 0;border-top:1px solid var(--line)}
.sum-label{font-size:15px;color:var(--muted)}
.sum-value{font-family:var(--display);font-size:40px;line-height:1;font-variant-numeric:tabular-nums}
.sum-value small{font-family:var(--body);font-size:14px;color:var(--muted);margin-left:6px}
.sum-count{font-size:14px;color:var(--muted);padding:14px 0 18px;border-top:1px solid var(--line)}
.sum-actions{display:flex;flex-direction:column;gap:10px}

.cards{display:flex;flex-direction:column}
.card{display:grid;grid-template-columns:1fr;gap:14px;padding:36px 0;border-top:1px solid var(--line)}
.card:first-child{border-top:0;padding-top:20px}
.card-step{font-size:14px;color:var(--muted)}
.card-head{display:flex;flex-direction:column;gap:14px}
.card h3{font-size:clamp(34px,5.2vw,60px);max-width:13ch}
.card-text{font-size:17px;max-width:46ch}
.card ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;color:var(--muted);font-size:15px}
.card-foot{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:10px}
.price{font-family:var(--display);font-size:44px;line-height:1;font-variant-numeric:tabular-nums;display:flex;flex-direction:column;gap:8px}
.price span{white-space:nowrap}
.price small{font-family:var(--body);font-size:14px;color:var(--muted);line-height:1}
.card.on .add{background:var(--blue);border-color:var(--blue);color:#fff}
.locked .add,.locked [data-all]{pointer-events:none}

.done{gap:0}
.done img{width:48px;height:48px;margin-bottom:18px}
.done h2{font-size:clamp(40px,6vw,56px);margin-bottom:14px}
.done > p{margin-bottom:22px;max-width:40ch}
.done ul,.modal-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.done li,.modal-list li{display:flex;justify-content:space-between;gap:16px;font-size:15px;padding:12px 0;border-top:1px solid var(--line)}
.done li span:last-child,.modal-list li span:last-child{white-space:nowrap;font-variant-numeric:tabular-nums}
.done .pill{margin-top:22px}
.done-note{font-size:14px;color:var(--muted);margin-top:12px}

.foot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:28px 0 0;margin-top:72px;border-top:1.5px solid var(--ink)}
.foot img{width:34px;height:34px}
.foot .wordmark{font-size:20px}

.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;align-items:center;gap:10px;padding:12px 20px;background:var(--paper);border-top:1.5px solid var(--ink)}
.bar-totals{display:flex;flex-direction:column;font-size:12px;line-height:1.35;color:var(--muted);margin-right:auto;min-width:0}
.bar-totals b{font-family:var(--display);font-weight:400;font-size:19px;color:var(--ink);font-variant-numeric:tabular-nums;margin-right:2px}
.bar .pill{min-height:46px;padding:0 20px;font-size:14px}
.bar [data-all]{display:none}

.modal{position:fixed;inset:0;z-index:40;display:grid;place-items:end center;background:rgba(0,0,0,.42);animation:fade .35s var(--ease)}
.modal-box{position:relative;width:100%;max-width:540px;max-height:94vh;max-height:94dvh;overflow:auto;background:var(--paper);padding:32px 24px 28px;display:flex;flex-direction:column;animation:rise .5s var(--ease)}
.modal-box h2{font-size:40px;padding-right:48px;margin-bottom:18px}
.modal-close{position:absolute;top:22px;right:18px;width:44px;height:44px;border:0;background:transparent;font-size:28px;line-height:1;cursor:pointer;transition:opacity .3s var(--ease)}
.modal-close:hover{opacity:.5}
.modal form{display:flex;flex-direction:column;gap:10px;margin-top:22px;border-top:1.5px solid var(--ink);padding-top:22px}
.modal label{font-size:14px;color:var(--muted)}
.modal input[type=text]{height:50px;border:0;border-bottom:1.5px solid var(--ink);border-radius:0;background:transparent;padding:0;font-size:18px;transition:border-color .3s var(--ease)}
.modal input[type=text]:focus{outline:none;border-bottom-color:var(--blue)}
.check{display:flex;gap:12px;align-items:flex-start;font-size:15px !important;color:var(--ink) !important;margin:14px 0 8px;cursor:pointer}
.check input{flex:none;width:20px;height:20px;margin:2px 0 0;accent-color:var(--blue)}
.form-error{color:#B00020;font-size:14px}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{transform:translateY(28px);opacity:0}}

.rise{animation:rise-in .9s var(--ease) both}
@keyframes rise-in{from{opacity:0;transform:translateY(22px)}}

@media (min-width:920px){
  #app{padding:0 40px 80px}
  .builder{display:grid;grid-template-columns:minmax(0,1fr) minmax(380px,440px);column-gap:72px;align-items:start;padding-top:36px}
  .stage-col{grid-column:2;grid-row:1;position:sticky;top:28px}
  .cards{grid-column:1;grid-row:1}
  #rack{height:clamp(280px,40vh,380px)}
  .summary{display:flex}
  .sum-actions{flex-direction:row}
  .sum-actions .pill{flex:1;padding:0 14px}
  .card-head{flex-direction:row;align-items:flex-start;justify-content:space-between;gap:32px}
  .price{align-items:flex-end;text-align:right;padding-top:6px}
  .bar{display:none}
  .modal{place-items:center}
  .modal-box{padding:40px}
  .locked #rack{height:220px}
}
@media (max-width:919px){
  .card-foot{flex-direction:column;align-items:stretch}
  .card .add{width:100%}
  .price{flex-direction:row;align-items:baseline;gap:10px}
}
@media (min-width:520px) and (max-width:919px){
  .bar [data-all]{display:inline-flex}
  .bar{padding:12px 24px}
}
.locked .stage-head p,.locked .hint{display:none}
@media (hover:hover){.hint-touch{display:none}}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important}
}
</style>
</head>

<main class="gate" id="gate">
  <div class="gate-top"><span class="wordmark">.coleman</span></div>

      <p class="gate-error" id="gate-error" role="alert"></p>
    </form>
  </div>
</main>

var PROPOSTA = "pecarara-contagem-2026-11";

(function(){
"use strict";
var store = {
  get:function(k){try{return localStorage.getItem(PROPOSTA+":"+k)}catch(e){return null}},
  set:function(k,v){try{localStorage.setItem(PROPOSTA+":"+k,v)}catch(e){}}
};
var $ = function(s,r){return (r||document).querySelector(s)};
var $$ = function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
var reduced = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------- Senha: o conteúdo só existe depois de decifrado ---------- */
function b64(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}
function norm(p){return (p||"").replace(/\s+/g,"").toUpperCase()}
function decrypt(pass){
  var enc=new TextEncoder();
  return crypto.subtle.importKey("raw",enc.encode(norm(pass)),"PBKDF2",false,["deriveKey"]).then(function(k){
    return crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(PAYLOAD.salt),iterations:PAYLOAD.iter,hash:"SHA-256"},k,{name:"AES-GCM",length:256},false,["decrypt"]);
  }).then(function(key){
    return crypto.subtle.decrypt({name:"AES-GCM",iv:b64(PAYLOAD.iv)},key,b64(PAYLOAD.data));
  }).then(function(buf){return new TextDecoder().decode(buf)});
}
var gate=$("#gate"),gateBox=$("#gate-box"),gateErr=$("#gate-error"),gateBtn=$("#gate-btn"),passInput=$("#pass");
function tryOpen(pass,silent){
  if(!window.crypto||!crypto.subtle){gateErr.textContent="Este navegador não consegue abrir a proposta. Abram o link no Chrome ou no Safari.";return}
  gateBtn.disabled=true;gateBtn.textContent="Abrindo…";
  decrypt(pass).then(function(html){
    store.set("pass",norm(pass));
    open(html);
  }).catch(function(){
    gateBtn.disabled=false;gateBtn.textContent="Abrir proposta";
    if(silent)return;
    gateErr.textContent="Senha incorreta. Confiram a mensagem que enviamos e tentem de novo.";
    gateBox.classList.remove("shake");void gateBox.offsetWidth;gateBox.classList.add("shake");
    passInput.select();
  });
}
$("#gate-form").addEventListener("submit",function(e){
  e.preventDefault();gateErr.textContent="";
  if(!norm(passInput.value)){gateErr.textContent="Digitem a senha para abrir.";return}
  tryOpen(passInput.value,false);
});
var saved=store.get("pass");
if(saved){tryOpen(saved,true)}

/* ---------- Rastreamento ---------- */
var visitor=store.get("visitor");
if(!visitor){visitor=Math.random().toString(36).slice(2,10)+Date.now().toString(36);store.set("visitor",visitor)}
var visits=parseInt(store.get("visits")||"0",10);
var t0=Date.now();
function track(evento,extra){
  if(!CONFIG.rastreador)return;
  var body={proposta:PROPOSTA,evento:evento,visitante:visitor,visita:visits,
    aparelho:(window.innerWidth<760?"Celular":"Computador"),tela:window.innerWidth+"x"+window.innerHeight,
    segundos:Math.round((Date.now()-t0)/1000)};
  for(var k in (extra||{}))body[k]=extra[k];
  try{
    fetch(CONFIG.rastreador,{method:"POST",mode:"no-cors",keepalive:true,
      headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body)}).catch(function(){});
  }catch(e){}
}

/* ---------- Proposta ---------- */
var app=$("#app"),S=[],sel={},approved=null,rack=null;
var brl=function(n){return "R$ "+Math.round(n).toLocaleString("pt-BR")};
function totals(){var u=0,m=0;S.forEach(function(s){if(sel[s.id]){if(s.tipo==="unico")u+=s.preco;else m+=s.preco}});return {unico:u,mensal:m}}
function chosen(){return S.filter(function(s){return sel[s.id]})}

function open(html){
  app.innerHTML=html;
  var data=JSON.parse($("#data",app).textContent);
  S=data.servicos;
  try{(JSON.parse(store.get("sel")||"[]")).forEach(function(id){sel[id]=true})}catch(e){}
  try{approved=JSON.parse(store.get("approved")||"null")}catch(e){approved=null}
  visits+=1;store.set("visits",String(visits));
  renderCards();bind();
  rack=makeRack($("#rack",app));
  gate.classList.add("leaving");
  setTimeout(function(){
    gate.hidden=true;app.hidden=false;window.scrollTo(0,0);
    reveal();
    rack.resize();
    if(approved){showDone(false)}else{refresh(false)}
  },reduced?0:650);
  track("abriu");
  window.addEventListener("pagehide",function(){track("saiu",{servicos:chosen().map(function(s){return s.nome}).join(" | ")})});
}

function reveal(){
  if(reduced)return;
  $$(".top,.hero > *,.stage-col",app).forEach(function(el,i){el.classList.add("rise");el.style.animationDelay=(i*90)+"ms"});
  if(!("IntersectionObserver" in window))return;
  var io=new IntersectionObserver(function(en){en.forEach(function(e){if(e.isIntersecting){e.target.classList.add("rise");io.unobserve(e.target)}})},{rootMargin:"0px 0px -6% 0px"});
  $$(".card,.foot",app).forEach(function(el){if(el.getBoundingClientRect().top>window.innerHeight)io.observe(el)});
}
function renderCards(){
  var wrap=$("#cards",app);wrap.textContent="";
  S.forEach(function(s,i){
    var a=document.createElement("article");a.className="card";a.dataset.id=s.id;
    a.innerHTML='<p class="card-step"></p><div class="card-head"><h3></h3><div class="price"></div></div><p class="card-text"></p><ul></ul>'+
      '<div class="card-foot"><button type="button" class="pill add"></button></div>';
    $(".card-step",a).textContent=s.etapa;
    $("h3",a).textContent=s.nome;$(".card-text",a).textContent=s.texto;
    s.itens.forEach(function(t){var li=document.createElement("li");var sp=document.createElement("span");sp.textContent=t;li.appendChild(sp);$("ul",a).appendChild(li)});
    $(".price",a).innerHTML="<span>"+brl(s.preco)+"</span><small>"+(s.tipo==="mensal"?"por mês":"pagamento único")+"</small>";
    $(".add",a).addEventListener("click",function(){toggle(s.id)});
    wrap.appendChild(a);
  });
}

function toggle(id,force){
  if(approved)return;
  var v=(force===undefined)?!sel[id]:force;
  if(!!sel[id]===v)return;
  sel[id]=v;refresh(true);
  if(rack)rack.kick(id);
}
function refresh(animate){
  store.set("sel",JSON.stringify(chosen().map(function(s){return s.id})));
  var t=totals(),n=chosen().length;
  $$(".card",app).forEach(function(c){
    var on=!!sel[c.dataset.id];c.classList.toggle("on",on);
    var b=$(".add",c);b.textContent=on?"Aprovado":"Aprovar este serviço";b.setAttribute("aria-pressed",on?"true":"false");
  });
  $$("[data-total]",app).forEach(function(el){countTo(el,t[el.dataset.total],animate)});
  var c=$("[data-count]",app);
  c.textContent=n===0?"Nenhuma peça na arara ainda.":(n===S.length?"Arara completa: as "+S.length+" peças.":n+" de "+S.length+" peças na arara.");
  $$("[data-confirm]",app).forEach(function(b){b.disabled=n===0});
  $$("[data-all]",app).forEach(function(b){b.textContent=n===S.length?"Limpar":"Aprovar todos"});
  if(rack)rack.set(sel);
}
function countTo(el,to,animate){
  var from=el._v||0;el._v=to;
  if(!animate||reduced||from===to){el.textContent=brl(to);return}
  var st=performance.now();cancelAnimationFrame(el._raf);
  (function step(now){var p=Math.min(1,(now-st)/450);p=1-Math.pow(1-p,3);el.textContent=brl(from+(to-from)*p);if(p<1)el._raf=requestAnimationFrame(step)})(st);
}

function bind(){
  $$("[data-all]",app).forEach(function(b){b.addEventListener("click",function(){
    var all=chosen().length===S.length;
    S.forEach(function(s,i){setTimeout(function(){toggle(s.id,!all)},reduced?0:i*110)});
  })});
  $$("[data-confirm]",app).forEach(function(b){b.addEventListener("click",openModal)});
  var modal=$("#modal",app);
  $("[data-close]",modal).addEventListener("click",closeModal);
  modal.addEventListener("click",function(e){if(e.target===modal)closeModal()});
  document.addEventListener("keydown",function(e){if(e.key==="Escape"&&!modal.hidden)closeModal()});
  $("#approve-form",app).addEventListener("submit",function(e){
    e.preventDefault();
    var name=$("#approver",app).value.trim(),ok=$("#agree",app).checked;
    var err=$("[data-form-error]",app);
    if(name.length<3||!ok){err.hidden=false;return}
    err.hidden=true;approve(name);
  });
}
function listInto(ul){
  ul.textContent="";
  chosen().forEach(function(s){var li=document.createElement("li"),a=document.createElement("span"),b=document.createElement("span");
    a.textContent=s.nome;b.textContent=brl(s.preco)+(s.tipo==="mensal"?"/mês":"");li.appendChild(a);li.appendChild(b);ul.appendChild(li)});
}
var lastFocus=null;
function openModal(){
  if(!chosen().length)return;
  var t=totals();listInto($("[data-modal-list]",app));
  $("[data-modal-unico]",app).textContent=brl(t.unico);
  $("[data-modal-mensal]",app).innerHTML=brl(t.mensal)+"<small>/mês</small>";
  lastFocus=document.activeElement;$("#modal",app).hidden=false;
  setTimeout(function(){$("#approver",app).focus()},60);
  track("iniciou_aprovacao",{servicos:chosen().map(function(s){return s.nome}).join(" | "),unico:t.unico,mensal:t.mensal});
}
function closeModal(){$("#modal",app).hidden=true;if(lastFocus&&lastFocus.focus)lastFocus.focus()}

function approve(name){
  var t=totals(),d=new Date();
  approved={nome:name,quando:d.toISOString(),ids:chosen().map(function(s){return s.id}),unico:t.unico,mensal:t.mensal};
  store.set("approved",JSON.stringify(approved));
  track("APROVOU",{aprovador:name,servicos:chosen().map(function(s){return s.nome}).join(" | "),unico:t.unico,mensal:t.mensal});
  closeModal();showDone(true);
}
function showDone(fresh){
  S.forEach(function(s){sel[s.id]=approved.ids.indexOf(s.id)>=0});
  refresh(false);
  app.classList.add("locked");
  if(rack)setTimeout(rack.resize,30);
  var d=new Date(approved.quando);
  var when=d.toLocaleDateString("pt-BR")+" às "+d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
  $("#summary",app).hidden=true;$("#bar",app).hidden=true;
  var box=$("#done",app);box.hidden=false;
  $("[data-done-text]",box).textContent="Aceite registrado por "+approved.nome+" em "+when+". A Coleman entra em contato para dar início.";
  listInto($("[data-done-list]",box));
  $("[data-done-unico]",box).textContent=brl(approved.unico);
  $("[data-done-mensal]",box).innerHTML=brl(approved.mensal)+"<small>/mês</small>";
  var msg="Olá, Coleman! Aqui é "+approved.nome+", da Peça Rara Contagem. Aprovamos a proposta em "+when+":\n"+
    chosen().map(function(s){return "• "+s.nome+": "+brl(s.preco)+(s.tipo==="mensal"?"/mês":"")}).join("\n")+
    "\n\nPagamento único: "+brl(approved.unico)+"\nMensal: "+brl(approved.mensal)+"/mês";
  var wa=$("[data-wa]",box),cp=$("[data-copy]",box);
  if(CONFIG.whatsapp){wa.href="https://wa.me/"+CONFIG.whatsapp.replace(/\D/g,"")+"?text="+encodeURIComponent(msg)}
  else{wa.hidden=true;cp.hidden=false}
  cp.onclick=function(){
    var note=$("[data-copy-note]",box);
    try{navigator.clipboard.writeText(msg).then(function(){note.hidden=false},function(){})}catch(e){}
  };
  $$(".add",app).forEach(function(b){b.disabled=true});
  if(fresh){
    if(rack)rack.celebrate();
    if(true){box.scrollIntoView({behavior:reduced?"auto":"smooth",block:"start"})}
  }
}

/* ---------- Arara em 3D (canvas próprio, sem bibliotecas) ---------- */
function makeRack(cv){
  var ctx=cv.getContext("2d"),W=0,H=0,dpr=1,f=1,cx=0,cy=0;
  var BAR=2.5,D=9,rotY=-0.32,rotTarget=-0.32,tilt=0.07,dragging=false,dragX=0,dragRot=0,moved=0,hover=-1,visible=true,raf=0,last=0;
  var XS=[-1.17,-0.39,0.39,1.17];
  var SH={
    tee:[[0.08,0.30],[0.27,0.36],[0.42,0.54],[0.35,0.64],[0.25,0.56],[0.25,1.22]],
    long:[[0.08,0.30],[0.27,0.36],[0.41,0.98],[0.32,1.0],[0.25,0.6],[0.25,1.28]],
    dress:[[0.07,0.30],[0.21,0.35],[0.2,0.56],[0.16,0.78],[0.36,1.62]],
    coat:[[0.09,0.30],[0.29,0.37],[0.42,1.05],[0.33,1.07],[0.27,0.62],[0.28,1.5]]
  };
  var P=S.map(function(s,i){
    var half=SH[s.forma]||SH.tee,pts=[[0,0.37]];
    half.forEach(function(p){pts.push(p)});
    for(var j=half.length-1;j>=0;j--)pts.push([-half[j][0],half[j][1]]);
    return {s:s,x:XS[i],pts:pts,on:0,target:0,ang:0,vel:0,twist:0.16*(i%2?-1:1),path:null,z:0};
  });
  function proj(x,y,z){
    var c=Math.cos(rotY),sn=Math.sin(rotY),X=x*c+z*sn,Z=-x*sn+z*c,Y=y-1.38;
    var ct=Math.cos(tilt),st=Math.sin(tilt),Y2=Y*ct-Z*st,Z2=Y*st+Z*ct,zz=D+(-Z2);
    return [cx+f*X/zz,cy-f*Y2/zz,zz];
  }
  function local(p,u,v,dz){ /* ponto da peça: balanço em z, torção em y, pendurada na barra */
    var ca=Math.cos(p.ang),sa=Math.sin(p.ang),lx=u*ca+v*sa,ly=-v*ca+u*sa;
    var ct=Math.cos(p.twist),st=Math.sin(p.twist);
    return proj(p.x+lx*ct+dz*st,BAR+ly,(-lx*st+dz*ct));
  }
  function ease(t){return 1-Math.pow(1-t,3)}
  function seg(a,b,r,col,hi){
    var p=proj(a[0],a[1],a[2]),q=proj(b[0],b[1],b[2]),w=Math.max(1.5,f*r*2/((p[2]+q[2])/2));
    ctx.lineCap="round";ctx.strokeStyle=col;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(p[0],p[1]);ctx.lineTo(q[0],q[1]);ctx.stroke();
    if(hi){ctx.strokeStyle=hi;ctx.lineWidth=Math.max(1,w*0.28);ctx.beginPath();ctx.moveTo(p[0]-w*0.18,p[1]-w*0.2);ctx.lineTo(q[0]-w*0.18,q[1]-w*0.2);ctx.stroke()}
    return (p[2]+q[2])/2;
  }
  function shade(hex,k){
    var n=parseInt(hex.slice(1),16),r=n>>16,g=(n>>8)&255,b=n&255;
    var m=function(c){return Math.max(0,Math.min(255,Math.round(k<0?c*(1+k):c+(255-c)*k)))};
    return "rgb("+m(r)+","+m(g)+","+m(b)+")";
  }
  function drawPiece(p,idx){
    var s=p.s,e=ease(p.on),i,pt;
    /* cabide */
    var hook=[local(p,0,-0.02,0),local(p,0.05,0.07,0),local(p,0,0.16,0)];
    var hw=Math.max(1.2,f*0.012*2/hook[0][2]);
    ctx.strokeStyle="#6F747C";ctx.lineWidth=hw;ctx.lineCap="round";ctx.lineJoin="round";
    ctx.beginPath();ctx.moveTo(hook[0][0],hook[0][1]);ctx.quadraticCurveTo(hook[1][0],hook[1][1],hook[2][0],hook[2][1]);
    var l=local(p,-0.3,0.36,0),r=local(p,0.3,0.36,0);
    ctx.moveTo(l[0],l[1]);ctx.lineTo(hook[2][0],hook[2][1]);ctx.lineTo(r[0],r[1]);ctx.stroke();
    /* corpo: camada de trás e da frente dão a espessura */
    var facing=Math.cos(p.twist+rotY),k=(facing-0.85)*1.2;
    function poly(dz){var path=new Path2D();p.pts.forEach(function(q,j){pt=local(p,q[0],q[1],dz);if(j)path.lineTo(pt[0],pt[1]);else path.moveTo(pt[0],pt[1])});path.closePath();return path}
    var back=poly(-0.05),front=poly(0.05);
    p.path=front;
    ctx.lineJoin="round";
    if(e>0.01){
      ctx.globalAlpha=e;
      ctx.fillStyle=shade(s.cor,-0.38);ctx.fill(back);
      ctx.fillStyle=shade(s.cor,k);ctx.fill(front);
      ctx.strokeStyle=s.cor==="#FFFFFF"?"rgba(0,0,0,.55)":shade(s.cor,-0.3);ctx.lineWidth=1.2;ctx.stroke(front);
      ctx.globalAlpha=1;
    }
    if(e<0.99){
      ctx.globalAlpha=1-e;
      ctx.fillStyle=(hover===idx)?"rgba(0,0,0,.09)":"rgba(0,0,0,.03)";ctx.fill(front);
      ctx.setLineDash([4,5]);ctx.strokeStyle=(hover===idx)?"#000000":"rgba(0,0,0,.42)";ctx.lineWidth=1.3;ctx.stroke(front);ctx.setLineDash([]);
      ctx.globalAlpha=1;
    }
    /* etiqueta na peça, no plano do tecido */
    var o=local(p,0,0.74,0.051),ux=local(p,1,0.74,0.051),vy=local(p,0,1.74,0.051);
    ctx.save();
    ctx.setTransform(dpr*(ux[0]-o[0])/100,dpr*(ux[1]-o[1])/100,dpr*(vy[0]-o[0])/100,dpr*(vy[1]-o[1])/100,dpr*o[0],dpr*o[1]);
    ctx.textAlign="center";ctx.textBaseline="middle";
    var ink=e>0.5?s.tinta:"#000000";
    ctx.globalAlpha=e>0.5?1:0.62;
    ctx.fillStyle=ink;
    var size=s.curto.length>8?10:(s.curto.length>6?12:14.5);
    ctx.font="400 "+size+'px Anton, "Arial Narrow", Impact, sans-serif';
    ctx.fillText(s.curto,0,0);
    ctx.font='700 6.4px "Open Sans", system-ui, sans-serif';
    ctx.fillText(e>0.5?brl(s.preco)+(s.tipo==="mensal"?"/mês":""):"+ pendurar",0,13);
    ctx.restore();ctx.globalAlpha=1;
  }
  function draw(){
    ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);
    /* sombra no chão */
    var g0=proj(0,0,0),gx=proj(1.9,0,0),gz=proj(0,0,0.6);
    var rx=Math.abs(gx[0]-g0[0])+10,ry=Math.max(8,Math.abs(gz[1]-g0[1])+6);
    ctx.save();ctx.translate(g0[0],g0[1]);ctx.scale(1,ry/rx);
    var gr=ctx.createRadialGradient(0,0,0,0,0,rx);gr.addColorStop(0,"rgba(0,0,0,.20)");gr.addColorStop(1,"rgba(0,0,0,0)");
    ctx.fillStyle=gr;ctx.beginPath();ctx.arc(0,0,rx,0,6.283);ctx.fill();ctx.restore();
    var steel="#9A9FA7",dark="#70757D",hi="rgba(255,255,255,.75)";
    var items=[];
    [-1.62,1.62].forEach(function(x){
      items.push({z:proj(x,0.03,0)[2]+0.01,fn:function(){seg([x,0.03,-0.5],[x,0.03,0.5],0.04,dark,null);
        [[-0.5],[0.5]].forEach(function(zz){var w=proj(x,0.0,zz[0]);ctx.fillStyle="#111";ctx.beginPath();ctx.arc(w[0],w[1]+2,Math.max(2.5,f*0.05/w[2]),0,6.283);ctx.fill()})}});
      items.push({z:proj(x,1.25,0)[2],fn:function(){seg([x,0.03,0],[x,BAR,0],0.035,steel,hi)}});
    });
    items.push({z:proj(0,BAR,0)[2]+0.02,fn:function(){seg([-1.85,BAR,0],[1.85,BAR,0],0.035,steel,hi)}});
    P.forEach(function(p,i){items.push({z:proj(p.x,BAR-0.8,0)[2],fn:function(){drawPiece(p,i)}})});
    items.sort(function(a,b){return b.z-a.z});
    items.forEach(function(it){it.fn()});
  }
  function tick(now){
    raf=0;
    var dt=Math.min(0.05,(now-last)/1000||0.016);last=now;
    var busy=false;
    if(!dragging){
      var idle=reduced?0:Math.sin(now/2600)*0.10;
      var goal=rotTarget+idle;rotY+=(goal-rotY)*Math.min(1,dt*3);busy=!reduced;
    }
    P.forEach(function(p){
      var d=p.target-p.on;
      if(Math.abs(d)>0.001){p.on+=d*Math.min(1,dt*(reduced?60:7));busy=true}else p.on=p.target;
      var acc=-38*p.ang-3.2*p.vel;p.vel+=acc*dt;p.ang+=p.vel*dt;
      if(Math.abs(p.ang)>0.0005||Math.abs(p.vel)>0.0005)busy=true;else{p.ang=0;p.vel=0}
    });
    draw();
    if(busy&&visible)raf=requestAnimationFrame(tick);
  }
  function wake(){if(!raf){last=performance.now();raf=requestAnimationFrame(tick)}}
  function resize(){
    var r=cv.getBoundingClientRect();if(!r.width)return;
    dpr=Math.min(2,window.devicePixelRatio||1);W=r.width;H=r.height;
    cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
    f=Math.min((W/2)*D/2.25,(H/2)*D/1.62);cx=W/2;cy=H/2+H*0.015;
    draw();wake();
  }
  function hit(e){
    var r=cv.getBoundingClientRect(),x=(e.clientX-r.left)*dpr,y=(e.clientY-r.top)*dpr,best=-1,bz=1e9;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    P.forEach(function(p,i){if(p.path&&ctx.isPointInPath(p.path,x,y)){var z=proj(p.x,BAR-0.8,0)[2];if(z<bz){bz=z;best=i}}});
    return best;
  }
  cv.addEventListener("pointerdown",function(e){dragging=true;moved=0;dragX=e.clientX;dragRot=rotY;cv.classList.add("grabbing");try{cv.setPointerCapture(e.pointerId)}catch(_){}});
  cv.addEventListener("pointermove",function(e){
    if(dragging){var dx=e.clientX-dragX;moved=Math.max(moved,Math.abs(dx));rotY=Math.max(-1.1,Math.min(1.1,dragRot+dx*0.008));
      P.forEach(function(p){p.vel+=(e.movementX||0)*0.004});wake();return}
    var h=hit(e);if(h!==hover){hover=h;cv.classList.toggle("pointing",h>=0&&!approved);wake()}
  });
  function up(e){
    if(!dragging)return;dragging=false;cv.classList.remove("grabbing");
    if(moved<7){var h=hit(e);if(h>=0)toggle(P[h].s.id)}
    else{rotTarget=Math.max(-0.6,Math.min(0.6,rotY))}
    wake();
  }
  cv.addEventListener("pointerup",up);cv.addEventListener("pointercancel",function(){dragging=false;cv.classList.remove("grabbing")});
  cv.addEventListener("pointerleave",function(){if(hover>=0){hover=-1;cv.classList.remove("pointing");wake()}});
  window.addEventListener("resize",resize);
  if("IntersectionObserver" in window){new IntersectionObserver(function(en){visible=en[0].isIntersecting;if(visible)wake()}).observe(cv)}
  if(document.fonts&&document.fonts.ready){document.fonts.ready.then(function(){draw()})}
  return {
    resize:resize,
    set:function(m){P.forEach(function(p){p.target=m[p.s.id]?1:0});wake()},
    kick:function(id){P.forEach(function(p){if(p.s.id===id&&!reduced){p.vel+=(p.x<0?1:-1)*2.4}});wake()},
    celebrate:function(){if(reduced)return;P.forEach(function(p,i){setTimeout(function(){p.vel+=(i%2?-1:1)*3.2;wake()},i*90)})}
  };
}
})();
